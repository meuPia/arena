<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Arena · meuPiá Challenge</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/src/arena/arena.css" />
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </head>
  <body class="arena-pagina">
    <header class="arena-topo">
      <div class="arena-marca"><img src="/logo.svg" alt="" /> meuPiá Challenge</div>
      <div id="topo-equipe" class="arena-topo-equipe"></div>
    </header>

    <main class="arena-main">
      <section id="tela-login" class="arena-login hidden">
        <p class="arena-sobretitulo">Univille · Engenharia de Software</p>
        <h1>CODE CHALLENGE — SYSTEM RECOVERY</h1>
        <p class="arena-lead">Diversos serviços do sistema estão comprometidos. Sua equipe tem até o final da noite para recuperar o maior número possível de módulos.</p>
        <form id="form-login" class="arena-form">
          <label for="codigo-equipe">Código da equipe</label>
          <input id="codigo-equipe" class="arena-input" autocomplete="off" autocapitalize="characters" required placeholder="Ex.: ORION-7K2Q" />
          <button class="arena-primario" type="submit"><i data-lucide="log-in"></i> Entrar na Code Arena</button>
          <p id="erro-login" class="arena-erro" role="alert"></p>
        </form>
      </section>

      <section id="tela-painel" class="hidden">
        <div class="arena-faixa">
          <div>
            <p class="arena-sobretitulo" id="evento-nome"></p>
            <h1 id="equipe-nome"></h1>
          </div>
          <div class="arena-faixa-dados">
            <div class="arena-kpi"><span id="kpi-pontos">0</span><small>pontos</small></div>
            <div class="arena-kpi"><span id="kpi-relogio">--:--</span><small id="kpi-relogio-rotulo">restante</small></div>
          </div>
        </div>
        <p id="situacao" class="arena-situacao"></p>
        <div id="niveis" class="arena-niveis"></div>
        <p class="arena-rodape-painel">
          <a href="/placar.html" target="_blank">Ver placar</a> ·
          <button id="btn-sair" class="arena-link">Trocar de equipe</button>
        </p>
      </section>
    </main>

    <script type="module" src="/src/arena/painel.js"></script>
  </body>
</html>
